<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hackathons - ISOTOPES</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-gradient sticky-top"><div class="container-fluid"><a class="navbar-brand fw-bold" href="student-dashboard.html"><i class="fas fa-dna"></i> ISOTOPES</a><button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="navbarNav"><ul class="navbar-nav ms-auto"><li class="nav-item"><a class="nav-link" href="student-dashboard.html">Dashboard</a></li><li class="nav-item"><a class="nav-link" href="student-profile.html">Profile</a></li><li class="nav-item"><a class="nav-link" href="skill-assessment.html">Assessment</a></li><li class="nav-item"><a class="nav-link" href="opportunities.html">Opportunities</a></li><li class="nav-item"><a class="nav-link active" href="hackathons.html">Hackathons</a></li><li class="nav-item"><button class="btn btn-link nav-link" onclick="logoutUser()">Logout</button></li></ul></div></div></nav>

  <main class="container py-5">
    <div id="alertContainer" class="position-fixed top-0 end-0 p-3" style="z-index:1080"></div>
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4"><div><h2 class="fw-bold mb-1">Hackathon Discovery</h2><p class="text-muted mb-0">Real sourced events ranked using your saved profile. Always confirm details on the official website.</p></div><button class="btn btn-outline-primary" id="myHackathonsButton">My Hackathons</button></div>

    <section class="card border-0 shadow-sm mb-4"><div class="card-body"><form id="filterForm" class="row g-3">
      <div class="col-lg-4"><label class="form-label" for="search">Search</label><input class="form-control" id="search" name="search" placeholder="Name, organizer, or domain"></div>
      <div class="col-md-2"><label class="form-label" for="mode">Mode</label><select class="form-select" id="mode" name="mode"><option value="">All</option><option value="online">Online</option><option value="offline">Offline</option><option value="hybrid">Hybrid</option></select></div>
      <div class="col-md-2"><label class="form-label" for="status">Status</label><select class="form-select" id="status" name="status"><option value="">All</option><option value="registration-open">Registration open</option><option value="upcoming">Upcoming</option><option value="ongoing">Ongoing</option></select></div>
      <div class="col-md-2"><label class="form-label" for="domain">Domain</label><select class="form-select" id="domain" name="domain"><option value="">All</option><option>AI/ML</option><option>Web Development</option><option>Healthcare</option><option>Data Science</option><option>Blockchain</option><option>IoT</option><option>Sustainability</option><option>Open Innovation</option></select></div>
      <div class="col-md-2"><label class="form-label" for="free">Fee</label><select class="form-select" id="free" name="free"><option value="">All</option><option value="true">Free</option><option value="false">Paid</option></select></div>
      <div class="col-12 d-flex gap-2"><button class="btn btn-primary" type="submit">Apply filters</button><button class="btn btn-outline-secondary" id="clearFilters" type="button">Clear</button><label class="form-check ms-auto mt-2"><input class="form-check-input" name="eligibleOnly" type="checkbox" value="true"> Eligible for me</label></div>
    </form></div></section>

    <div id="hackathonState" class="alert alert-light border">Loading hackathons...</div>
    <div id="hackathonGrid" class="row g-4"></div>
    <nav class="d-flex justify-content-center align-items-center gap-3 mt-4" aria-label="Hackathon pages"><button class="btn btn-outline-primary" id="previousPage">Previous</button><span id="pageLabel"></span><button class="btn btn-outline-primary" id="nextPage">Next</button></nav>

    <section class="mt-5" id="myHackathonsSection" hidden><div class="d-flex justify-content-between align-items-center mb-3"><h3>My Hackathons</h3><select class="form-select w-auto" id="activityFilter"><option value="">All</option><option value="saved">Saved</option><option value="registered-self-reported">Registered — Self Reported</option><option value="participating">Participating</option><option value="completed">Completed</option></select></div><div id="myHackathonsState" class="text-muted">Loading...</div><div id="myHackathonsList" class="row g-3"></div></section>
  </main>

  <div class="modal fade" id="hackathonModal" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content"><div class="modal-header"><h5 class="modal-title" id="detailTitle">Hackathon</h5><button class="btn-close" data-bs-dismiss="modal" type="button"></button></div><div class="modal-body" id="detailBody"></div><div class="modal-footer" id="detailFooter"></div></div></div></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script><script src="js/hackathons-page.js"></script>
</body>
</html>
